
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>團購訂單小幫手</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, sans-serif;
  background: #f5f7f5;
  color: #34443c;
  margin: 0;
  padding: 24px;
}
main {
  max-width: 420px;
  margin: 50px auto;
  background: white;
  padding: 28px;
  border-radius: 20px;
  box-shadow: 0 4px 20px #00000010;
}
h1 { font-size: 25px; text-align: center; }
p { text-align: center; }
label { display: block; margin-top: 16px; }
input, button {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  border-radius: 10px;
  font-size: 16px;
}
input { border: 1px solid #ccd5cf; }
button {
  background: #527c65;
  color: white;
  border: none;
  margin-top: 20px;
}
#message { overflow-wrap: anywhere; }

</head>
<body>
<main>
<h1>團購訂單小幫手</h1>
<p>讓團購管理更簡單</p>
<form id="login">
<label>電子郵件</label>
<input id="email" type="email" autocomplete="username" required>
<label>密碼</label>
<input id="password" type="password" autocomplete="current-password" required>
<button type="submit">登入</button>
</form>
<section id="home" hidden>
<p>登入成功</p>
<p>團購管理系統建置中</p>
<button id="logout">登出</button>
</section>
<p id="message" role="status"></p>
</main>
<script>
const db = supabase.createClient(
  "https://oimpdpyoqkcjasjuqrjt.supabase.co",
  "sb_publishable_CyAQ9gh-5jrGSroxeC_KiQ_mlaGCW6Y"
);
const login = document.getElementById("login");
const home = document.getElementById("home");
const message = document.getElementById("message");

db.auth.onAuthStateChange((event, session) => {
  login.hidden = !!session;
  home.hidden = !session;
});

login.addEventListener("submit", async (e) => {
  e.preventDefault();
  message.textContent = "登入中…";
  try {
    const { error } = await db.auth.signInWithPassword({
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    });
    message.textContent = error
      ? "登入失敗：" + error.message
      : "登入成功";
  } catch {
    message.textContent = "連線失敗，請稍後再試";
  }
});

document.getElementById("logout").onclick = async () => {
  const { error } = await db.auth.signOut();
  message.textContent = error ? "登出失敗" : "已登出";
};
</script>
</body>
</html>
<script>

menu.style.cssText = `
  display:grid;

  "🚚 到貨管理",

  "▥ 條碼結帳",

features.forEach(name => {

</script><script>
(() => {
  const fields = [
    ["product_code","商品編號","text"],
    ["product_name","商品名稱","text"],
    ["barcode","商品條碼","text"],
    ["category","商品分類","text"],
    ["cost_price","成本價格","number"],
    ["Selling_price","銷售價格","number"],
    ["validity_days","有效天數","number"]
  ];

  const panel = document.createElement("section");
  panel.hidden = true;
  panel.innerHTML = `
    <h2>📦 商品管理</h2>
    <button type="button" id="productBack">返回首頁</button>
    <input id="productSearch" placeholder="搜尋商品名稱、編號、條碼">
    <h3>新增／修改商品</h3>
    <form id="productForm">
      ${fields.map(([key,label,type]) => `
        <label>${label}</label>
        <input id="p_${key}" type="${type}"
          ${type === "number" ? 'min="0" step="' +
          (key === "validity_days" ? "1" : "0.01") +
          '"' : ""}
          ${key === "product_name" ||
          key === "product_code" ? "required" : ""}>
      `).join("")}
      <label>商品狀態</label>
      <select id="p_is_active"
        style="width:100%;padding:12px;font-size:16px">
        <option value="true">啟用</option>
        <option value="false">停用</option>
      </select>
      <button type="submit">儲存商品</button>
      <button type="button" id="productClear"
        style="background:#88948d">清空／新增商品</button>
    </form>
    <p id="productMessage" role="status"></p>
    <hr>
    <h3>商品清單</h3>
    <div id="productList"></div>
    <button type="button" id="productMore"
      hidden>載入更多商品</button>
  `;

  home.insertBefore(panel, logoutButton);

  const el = id => document.getElementById(id);
  const form = el("productForm");
  const msg = el("productMessage");
  let editingId = null;
  let products = [];
  let busy = false;
  let page = 0;
  let version = 0;

  function clearForm() {
    editingId = null;
    form.reset();
    el("p_is_active").value = "true";
  }

  function renderProducts() {
    const list = el("productList");
    const keyword = el("productSearch")
      .value.trim().toLowerCase();

    list.replaceChildren();

    const filtered = products.filter(p =>
      [p.product_name,p.product_code,p.barcode,p.category]
        .some(v => String(v ?? "")
        .toLowerCase().includes(keyword))
    );

    if (!filtered.length) {
      list.textContent = "目前沒有符合的商品";
    }

    filtered.forEach(p => {
      const card = document.createElement("div");
      card.style.cssText =
        "border:1px solid #ccd5cf;border-radius:12px;padding:14px;margin:10px 0";

      const name = document.createElement("strong");
      name.textContent = p.product_name || "未命名商品";

      const detail = document.createElement("p");
      detail.style.textAlign = "left";
      detail.textContent =
        "編號：" + (p.product_code ?? "—") +
        "｜售價：" + (p.Selling_price ?? "—") +
        "｜" + (p.is_active ? "啟用" : "停用");

      const edit = document.createElement("button");
      edit.type = "button";
      edit.textContent = "修改商品";
      edit.onclick = () => {
        if (busy) return;
        editingId = p.id;
        fields.forEach(([key]) => {
          el("p_" + key).value = p[key] ?? "";
        });
        el("p_is_active").value =
          String(Boolean(p.is_active));
        msg.textContent = "正在修改商品";
        form.scrollIntoView({behavior:"smooth"});
      };

      card.append(name,detail,edit);
      list.appendChild(card);
    });
  }

  async function loadProducts(reset = true) {
    const current = ++version;
    if (reset) {
      page = 0;
      products = [];
      renderProducts();
    }

    el("productMore").hidden = true;

    const {data,error} = await db
      .from("products")
      .select("*")
      .order("id",{ascending:false})
      .range(page * 100,page * 100 + 99);

    if (current !== version) return;

    if (error) {
      msg.textContent = "讀取失敗：" + error.message;
      return;
    }

    products.push(...data);
    page++;
    renderProducts();
    el("productMore").hidden = data.length < 100;
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (busy) return;

    const payload = {};

    fields.forEach(([key,label,type]) => {
      const value = el("p_" + key).value.trim();
      payload[key] = value === "" ? null :
        type === "number" ? Number(value) : value;
    });

    if (!payload.product_name || !payload.product_code) {
      msg.textContent = "請輸入商品名稱及編號";
      return;
    }

    payload.is_active =
      el("p_is_active").value === "true";

    busy = true;
    const save = form.querySelector('[type="submit"]');
    save.disabled = true;
    msg.textContent = "儲存中…";

    try {
      const query = editingId === null
        ? db.from("products").insert(payload)
        : db.from("products").update(payload)
            .eq("id",editingId);

      const {data,error} = await query.select("id").single();

      if (error || !data) {
        msg.textContent = "儲存失敗：" +
          (error?.message || "沒有寫入資料");
        return;
      }

      clearForm();
      msg.textContent = "✅ 商品儲存成功";
      await loadProducts();
    } catch (err) {
      msg.textContent = "操作失敗：" + err.message;
    } finally {
      busy = false;
      save.disabled = false;
    }
  });

  el("productClear").onclick = () => {
    if (!busy) {
      clearForm();
      msg.textContent = "";
    }
  };

  el("productSearch").oninput = renderProducts;
  el("productMore").onclick = () => loadProducts(false);

  el("productBack").onclick = () => {
    if (busy) return;
    panel.hidden = true;
    menu.style.display = "grid";
    test.hidden = false;
    status.hidden = false;
  };

  const productButton = [...menu.querySelectorAll("button")]
    .find(b => b.textContent.includes("商品管理"));

  productButton.onclick = () => {
    menu.style.display = "none";
    test.hidden = true;
    status.hidden = true;
    panel.hidden = false;
    clearForm();
    msg.textContent = "";
    loadProducts();
  };

  db.auth.onAuthStateChange((event,session) => {
    if (!session) {
      version++;
      products = [];
      clearForm();
      el("productList").replaceChildren();
      el("productSearch").value = "";
      msg.textContent = "";
      panel.hidden = true;
      menu.style.display = "grid";
      test.hidden = false;
      status.hidden = false;
    }
  });
})();
</script>
<script>
(() => {
  const button = [...home.querySelectorAll("button")]
    .find(b => b.textContent.includes("團購活動"));

  const panel = document.createElement("section");
  panel.hidden = true;

  panel.innerHTML = `
    <h2>📅 團購活動</h2>
    <button id="actBack">返回首頁</button>
    <h3>新增／修改活動</h3>

    <form id="actForm">
      <label>活動名稱</label>
      <input id="actName" required>

      <label>開始日期</label>
      <input id="actStart" type="date" required>

      <label>結束日期</label>
      <input id="actEnd" type="date" required>

      <label>活動狀態</label>
      <select id="actStatus"
        style="width:100%;padding:14px;border-radius:10px">
        <option value="Draft">草稿</option>
        <option value="Active">進行中</option>
        <option value="Closed">已結束</option>
      </select>

      <label>備註</label>
      <textarea id="actNotes"
        style="width:100%;padding:12px;border-radius:10px"></textarea>

      <button type="submit" id="actSave">儲存活動</button>
      <button type="button" id="actClear">清空／新增活動</button>
    </form>

    <p id="actMsg"></p>
    <hr>
    <h3>活動清單</h3>
    <div id="actList"></div>
  `;

  const logout = document.getElementById("logout");
  home.insertBefore(panel, logout);

  const el = id => document.getElementById(id);
  const msg = el("actMsg");
  let editingId = null;
  let version = 0;

  const labels = {
    Draft: "草稿",
    Active: "進行中",
    Closed: "已結束"
  };

  function clearForm() {
    editingId = null;
    el("actForm").reset();
    msg.textContent = "";
  }

  async function loadActivities() {
    const current = ++version;
    const list = el("actList");

    list.textContent = "讀取中…";

    const { data, error } = await db
      .from("activities")
      .select("*")
      .order("created_at", { ascending: false });

    if (current !== version) return;

    list.replaceChildren();

    if (error) {
      list.textContent = "讀取失敗：" + error.message;
      return;
    }

    if (!data.length) {
      list.textContent = "目前尚無團購活動";
      return;
    }

    data.forEach(a => {
      const card = document.createElement("div");
      card.style.cssText =
        "border:1px solid #ccd5cf;border-radius:12px;padding:15px;margin:12px 0";

      const title = document.createElement("strong");
      title.textContent = a.activity_name;

      const date = document.createElement("p");
      date.textContent =
        (a.start_date || "") + " ～ " +
        (a.end_date || "");

      const state = document.createElement("p");
      state.textContent = labels[a.status] || a.status || "";

      const edit = document.createElement("button");
      edit.textContent = "修改活動";

      edit.onclick = () => {
        editingId = a.id;
        el("actName").value = a.activity_name || "";
        el("actStart").value = a.start_date || "";
        el("actEnd").value = a.end_date || "";
        el("actStatus").value = a.status || "Draft";
        el("actNotes").value = a.notes || "";
        msg.textContent = "";
        panel.scrollIntoView({ behavior: "smooth" });
      };

      card.append(title, date, state, edit);
      list.appendChild(card);
    });
  }

  el("actForm").onsubmit = async e => {
    e.preventDefault();

    const start = el("actStart").value;
    const end = el("actEnd").value;
    const name = el("actName").value.trim();

    if (!name) {
      msg.textContent = "請輸入活動名稱";
      return;
    }

    if (end < start) {
      msg.textContent = "❌ 結束日期不能早於開始日期";
      return;
    }

    const values = {
      activity_name: name,
      start_date: start,
      end_date: end,
      status: el("actStatus").value,
      notes: el("actNotes").value
    };

    const current = version;
    el("actSave").disabled = true;
    msg.textContent = "儲存中…";

    try {
      const query = editingId
        ? db.from("activities").update(values).eq("id", editingId)
        : db.from("activities").insert(values);

      const { error } = await query.select("id").single();

      if (current !== version) return;

      if (error) {
        msg.textContent = "❌ 儲存失敗：" + error.message;
        return;
      }

      clearForm();
      msg.textContent = "✅ 活動儲存成功";
      await loadActivities();

    } catch (error) {
      if (current === version) {
        msg.textContent = "❌ 連線失敗，請重新確認";
      }
    } finally {
      el("actSave").disabled = false;
    }
  };

  el("actClear").onclick = clearForm;

  let hiddenItems = [];

  button.onclick = () => {
    hiddenItems = [...home.children]
      .filter(node =>
        node !== panel &&
        node !== logout &&
        !node.hidden &&
        getComputedStyle(node).display !== "none"
      );

    hiddenItems.forEach(node => node.hidden = true);

    panel.hidden = false;
    clearForm();
    loadActivities();
  };

  el("actBack").onclick = () => {
    version++;
    panel.hidden = true;
    hiddenItems.forEach(node => node.hidden = false);
    hiddenItems = [];
    clearForm();
  };

  db.auth.onAuthStateChange((event, session) => {
    if (!session) {
      version++;
      panel.hidden = true;
      hiddenItems.forEach(node => node.hidden = false);
      hiddenItems = [];
      clearForm();
      el("actList").replaceChildren();
    }
  });
})();
</script>
<script>
(() => {
  const box = document.createElement("section");
  box.hidden = true;
  box.innerHTML = `
    <h2>📦 活動商品設定</h2>
    <label>選擇團購活動</label>
    <select id="apActivity" style="width:100%;padding:12px"></select>
    <label>選擇商品</label>
    <select id="apProduct" style="width:100%;padding:12px"></select>
    <label>活動售價</label>
    <input id="apPrice" type="number" min="0" step="0.01">
    <button id="apSave">加入活動商品</button>
    <p id="apMessage"></p>
  `;

  const back = document.getElementById("actBack");
  if (!back) return;

  const entry = document.createElement("button");
  entry.textContent = "📦 設定活動商品";
  entry.type = "button";
  back.after(entry, box);

  const el = id => document.getElementById(id);

  function fill(select, rows, name) {
    select.replaceChildren();
    rows.forEach(row => {
      select.add(new Option(row[name], row.id));
    });
  }

  entry.onclick = async () => {
    box.hidden = !box.hidden;
    if (box.hidden) return;

    const [a, p] = await Promise.all([
      db.from("activities").select("id,activity_name"),
      db.from("products").select("id,product_name")
    ]);

    if (a.error || p.error) {
      el("apMessage").textContent =
        "讀取失敗：" + (a.error || p.error).message;
      return;
    }

    fill(el("apActivity"), a.data, "activity_name");
    fill(el("apProduct"), p.data, "product_name");
    el("apMessage").textContent = "";
  };

  el("apSave").onclick = async () => {
    const activity = el("apActivity").value;
    const product = el("apProduct").value;
    const price = el("apPrice").value;
    const msg = el("apMessage");

    if (!activity || !product || price === "" ||
        !Number.isFinite(Number(price)) ||
        Number(price) < 0) {
      msg.textContent = "請完整填寫活動、商品及售價";
      return;
    }

    const button = el("apSave");
    button.disabled = true;

    try {
      const existing = await db.from("activity_products")
        .select("id")
        .eq("activity_id", activity)
        .eq("product_id", product)
        .limit(1);

      if (existing.error) throw existing.error;

      if (existing.data.length) {
        msg.textContent = "此商品已加入活動";
        return;
      }

      const { error } = await db.from("activity_products")
        .insert({
          activity_id: activity,
          product_id: product,
          activity_price: Number(price),
          is_available: true
        });

      if (error) throw error;
      msg.textContent = "✅ 活動商品加入成功";
      el("apPrice").value = "";
    } catch (e) {
      msg.textContent = "儲存失敗：" + e.message;
    } finally {
      button.disabled = false;
    }
  };

  db.auth.onAuthStateChange((event, session) => {
    if (!session) {
      box.hidden = true;
      el("apActivity").replaceChildren();
      el("apProduct").replaceChildren();
      el("apPrice").value = "";
      el("apMessage").textContent = "";
    }
  });
})();
</script>
<script>
(() => {
  const back = document.getElementById("actBack");
  if (!back || typeof db === "undefined") return;

  const button = document.createElement("button");
  button.textContent = "🏷️ 設定活動優惠";
  back.after(button);

  const box = document.createElement("section");
  box.hidden = true;
  button.after(box);

  box.innerHTML = `
    <h3>🏷️ 活動優惠設定</h3>

    <label>選擇團購活動</label>
    <select id="prActivity"></select>

    <label>優惠名稱</label>
    <input id="prName" placeholder="例如：雪糕4支118元">

    <label>優惠類型</label>
    <select id="prType">
      <option value="bundle_price">固定組合價</option>
      <option value="discount_rate">滿件折扣</option>
      <option value="second_item_price">第二件特價</option>
      <option value="discount_amount">滿件折抵</option>
    </select>

    <label>優惠件數</label>
    <input id="prQty" type="number" min="1" value="2">

    <label id="prValueLabel">組合優惠價格</label>
    <input id="prValue" type="number" min="0" step="0.01">

    <label>口味組合方式</label>
    <select id="prMix">
      <option value="same">相同商品</option>
      <option value="mix">自由混搭</option>
      <option value="fixed">指定組合</option>
    </select>

    <h4>適用商品</h4>
    <div id="prProducts"></div>

    <label>優惠狀態</label>
    <select id="prActive">
      <option value="true">啟用</option>
      <option value="false">停用</option>
    </select>

    <label>備註</label>
    <input id="prNotes">

    <button id="prSave">儲存優惠</button>
    <p id="prMessage"></p>
  `;

  const el = id => document.getElementById(id);
  const msg = el("prMessage");
  let revision = 0;

  function updateType() {
    const labels = {
      bundle_price: "組合優惠價格",
      discount_rate: "折扣百分比（79折請輸入79）",
      second_item_price: "第二件價格",
      discount_amount: "折抵金額"
    };
    el("prValueLabel").textContent =
      labels[el("prType").value];

    if (el("prType").value === "second_item_price") {
      el("prQty").value = 2;
      el("prQty").disabled = true;
    } else {
      el("prQty").disabled = false;
    }
  }

  el("prType").onchange = updateType;

  async function loadProducts() {
    const current = ++revision;
    const list = el("prProducts");
    list.replaceChildren();

    const activity = el("prActivity").value;
    if (!activity) return;

    try {
      const { data, error } = await db
        .from("activity_products")
        .select("id,product_id,activity_price,products(product_name)")
        .eq("activity_id", activity)
        .eq("is_available", true);

      if (current !== revision) return;
      if (error) throw error;

      for (const p of data || []) {
        const row = document.createElement("div");
        row.style.padding = "10px";
        row.style.borderBottom = "1px solid #ddd";

        const check = document.createElement("input");
        check.type = "checkbox";
        check.value = p.id;
        check.style.width = "auto";

        const label = document.createElement("label");
        label.append(check, " " +
          (p.products?.product_name || p.product_id) +
          "｜" + p.activity_price + "元");

        const qty = document.createElement("input");
        qty.type = "number";
        qty.min = "1";
        qty.value = "1";
        qty.placeholder = "指定數量";
        qty.className = "prRequired";

        row.append(label, qty);
        list.append(row);
      }

      if (!data?.length) {
        list.textContent = "尚未加入活動商品";
      }

      updateMix();
    } catch (e) {
      msg.textContent = "讀取失敗：" + e.message;
    }
  }

  function updateMix() {
    box.querySelectorAll(".prRequired").forEach(q => {
      q.style.display =
        el("prMix").value === "fixed" ? "" : "none";
    });
  }

  el("prMix").onchange = updateMix;
  el("prActivity").onchange = loadProducts;

  button.onclick = async () => {
    box.hidden = !box.hidden;
    if (box.hidden) return;

    msg.textContent = "";
    try {
      const { data, error } = await db
        .from("activities")
        .select("id,activity_name")
        .order("created_at", { ascending: false });

      if (error) throw error;

      el("prActivity").replaceChildren();

      for (const a of data || []) {
        el("prActivity").add(
          new Option(a.activity_name, a.id)
        );
      }

      await loadProducts();
      updateType();
    } catch (e) {
      msg.textContent = "讀取失敗：" + e.message;
    }
  };

  el("prSave").onclick = async () => {
    const save = el("prSave");
    const name = el("prName").value.trim();
    const activity = el("prActivity").value;
    const type = el("prType").value;
    const qty = Number(el("prQty").value);
    const raw = el("prValue").value;
    const value = Number(raw);
    const mix = el("prMix").value;

    const selected = [...box.querySelectorAll(
      '#prProducts input[type="checkbox"]:checked'
    )];

    if (!name || !activity || !raw ||
        !Number.isInteger(qty) || qty < 1 ||
        !Number.isFinite(value) || value < 0 ||
        !selected.length) {
      msg.textContent = "請完整填寫優惠資料並勾選商品";
      return;
    }

    if (type === "discount_rate" &&
        (value <= 0 || value > 100)) {
      msg.textContent = "折扣請輸入1至100之間的百分比";
      return;
    }

    const links = selected.map(c => ({
      activity_product_id: c.value,
      is_active: true,
      required_quantity: mix === "fixed"
        ? Number(c.closest("div")
            .querySelector(".prRequired").value)
        : null
    }));

    if (mix === "fixed" && (
        links.some(p =>
          !Number.isInteger(p.required_quantity) ||
          p.required_quantity < 1) ||
        links.reduce((s,p) =>
          s + p.required_quantity, 0) !== qty
    )) {
      msg.textContent = "指定商品數量合計必須等於優惠件數";
      return;
    }

    save.disabled = true;
    let newId = null;

    try {
      const record = {
        activity_id: activity,
        promotion_name: name,
        promotion_type: type,
        min_quantity: qty,
        bundle_price: type === "bundle_price"
          ? value : null,
        discount_rate: type === "discount_rate"
          ? value / 100 : null,
        second_item_price: type === "second_item_price"
          ? value : null,
        discount_amount: type === "discount_amount"
          ? value : 0,
        allow_mix: mix !== "same",
        is_active: el("prActive").value === "true",
        notes: el("prNotes").value
      };

      const { data, error } = await db
        .from("promotions")
        .insert(record)
        .select("id")
        .single();

      if (error) throw error;
      newId = data.id;

      const result = await db
        .from("promotion_products")
        .insert(links.map(p => ({
          ...p,
          promotion_id: newId
        })));

      if (result.error) throw result.error;

      msg.textContent = "✅ 優惠儲存成功";
      el("prName").value = "";
      el("prValue").value = "";
      el("prNotes").value = "";
      selected.forEach(c => c.checked = false);

    } catch (e) {
      let warning = "";
      if (newId) {
        const result = await db.from("promotions")
          .delete().eq("id", newId);
        if (result.error) {
          warning = "；可能留下未完成的優惠，請勿重複儲存";
        }
      }
      msg.textContent = "儲存失敗：" + e.message + warning;
    } finally {
      save.disabled = false;
    }
  };

  db.auth.onAuthStateChange((event, session) => {
    if (!session) {
      revision++;
      box.hidden = true;
      el("prActivity").replaceChildren();
      el("prProducts").replaceChildren();
      el("prName").value = "";
      el("prValue").value = "";
      el("prNotes").value = "";
      msg.textContent = "";
    }
  });
})();
</script>
<script>
(() => {
  const save = document.getElementById("prSave");
  if (!save || typeof db === "undefined") return;

  const el = id => document.getElementById(id);

  const section = document.createElement("section");
  section.innerHTML = `
    <hr>
    <h3>📋 已設定的優惠</h3>
    <button id="prRefresh">查看／更新優惠清單</button>
    <div id="prList"></div>
  `;
  el("prMessage").after(section);

  const types = {
    bundle_price: "固定組合價",
    discount_rate: "滿件折扣",
    second_item_price: "第二件特價",
    discount_amount: "滿件折抵"
  };

  function priceText(p) {
    switch (p.promotion_type) {
      case "bundle_price":
        return p.bundle_price + "元";
      case "discount_rate":
        return Number(
          (p.discount_rate * 100).toFixed(2)
        ) + "%";
      case "second_item_price":
        return "第二件" + p.second_item_price + "元";
      case "discount_amount":
        return "折抵" + p.discount_amount + "元";
      default:
        return "";
    }
  }

  async function load() {
    const list = el("prList");
    const activity = el("prActivity").value;
    list.textContent = "讀取中…";

    if (!activity) {
      list.textContent = "請先選擇團購活動";
      return;
    }

    const { data, error } = await db
      .from("promotions")
      .select("*")
      .eq("activity_id", activity)
      .order("created_at", { ascending: false });

    if (activity !== el("prActivity").value) return;

    list.replaceChildren();

    if (error) {
      list.textContent = error.message;
      return;
    }

    if (!data?.length) {
      list.textContent = "尚未設定優惠";
      return;
    }

    for (const p of data) {
      const card = document.createElement("div");
      card.style.cssText =
        "border:1px solid #ddd;border-radius:12px;" +
        "padding:12px;margin:12px 0;";

      const title = document.createElement("h4");
      title.textContent = p.promotion_name;

      const info = document.createElement("p");
      info.textContent =
        (types[p.promotion_type] || p.promotion_type) +
        "｜" + p.min_quantity + "件｜" +
        priceText(p);

      const status = document.createElement("p");
      status.textContent = p.is_active
        ? "🟢 啟用中" : "⚪ 已停用";

      const edit = document.createElement("button");
      edit.textContent = "✏️ 修改優惠";

      const toggle = document.createElement("button");
      toggle.textContent = p.is_active
        ? "停用優惠" : "重新啟用";

      toggle.onclick = async () => {
        toggle.disabled = true;

        const { error } = await db
          .from("promotions")
          .update({ is_active: !p.is_active })
          .eq("id", p.id);

        if (error) {
          alert(error.message);
          toggle.disabled = false;
        } else {
          await load();
        }
      };

      const editor = document.createElement("div");
      editor.hidden = true;

      editor.innerHTML = `
        <label>優惠名稱</label>
        <input class="editName">

        <label>優惠價格／折扣</label>
        <input class="editValue"
          type="number" min="0" step="0.01">

        <label>備註</label>
        <input class="editNotes">

        <button class="editSave">確認修改</button>
        <button class="editCancel">取消修改</button>
        <p class="editMessage"></p>
      `;

      const field = name =>
        editor.querySelector("." + name);

      edit.onclick = () => {
        editor.hidden = !editor.hidden;

        field("editName").value = p.promotion_name;
        field("editNotes").value = p.notes || "";

        const values = {
          bundle_price: p.bundle_price,
          discount_rate: p.discount_rate * 100,
          second_item_price: p.second_item_price,
          discount_amount: p.discount_amount
        };

        field("editValue").value =
          values[p.promotion_type] ?? "";
      };

      field("editCancel").onclick = () => {
        editor.hidden = true;
      };

      field("editSave").onclick = async () => {
        const name = field("editName").value.trim();
        const raw = field("editValue").value;
        const value = Number(raw);
        const message = field("editMessage");

        if (!name || !raw ||
            !Number.isFinite(value) || value < 0) {
          message.textContent = "請輸入正確資料";
          return;
        }

        if (p.promotion_type === "discount_rate" &&
            (value <= 0 || value > 100)) {
          message.textContent = "折扣請輸入1至100";
          return;
        }

        const update = {
          promotion_name: name,
          notes: field("editNotes").value
        };

        switch (p.promotion_type) {
          case "bundle_price":
            update.bundle_price = value;
            break;
          case "discount_rate":
            update.discount_rate = value / 100;
            break;
          case "second_item_price":
            update.second_item_price = value;
            break;
          case "discount_amount":
            update.discount_amount = value;
            break;
          default:
            message.textContent = "不支援的優惠類型";
            return;
        }

        field("editSave").disabled = true;

        const { error } = await db
          .from("promotions")
          .update(update)
          .eq("id", p.id);

        if (error) {
          message.textContent = error.message;
          field("editSave").disabled = false;
        } else {
          await load();
        }
      };

      card.append(
        title, info, status, edit, toggle, editor
      );
      list.append(card);
    }
  }

  el("prRefresh").onclick = load;

  el("prActivity").addEventListener("change", () => {
    el("prList").replaceChildren();
  });

  const observer = new MutationObserver(() => {
    if (el("prMessage").textContent.includes("儲存成功")) {
      load();
    }
  });

  observer.observe(el("prMessage"), {
    childList: true,
    characterData: true,
    subtree: true
  });

  db.auth.onAuthStateChange((event, session) => {
    if (!session) {
      el("prList").replaceChildren();
    }
  });
})();
</script>
<script>
(() => {
  const back = document.getElementById("actBack");
  if (!back || typeof db === "undefined") return;

  const button = document.createElement("button");
  button.textContent = "🔤 設定喊單代號";
  back.after(button);

  const box = document.createElement("section");
  box.hidden = true;
  button.after(box);

  box.innerHTML = `
    <h3>🔤 喊單代號設定</h3>

    <label>選擇團購活動</label>
    <select id="ocActivity"></select>

    <p>請設定商品及優惠的喊單代號。
    沒有代號的項目可以留空。</p>

    <h4>📦 商品代號</h4>
    <div id="ocProducts"></div>

    <h4>🏷️ 優惠組合代號</h4>
    <div id="ocPromotions"></div>

    <button id="ocSave">儲存喊單代號</button>
    <p id="ocMessage"></p>
  `;

  const el = id => document.getElementById(id);
  const msg = el("ocMessage");
  let revision = 0;

  function addRow(container, item, name, table) {
    const row = document.createElement("div");
    row.style.cssText =
      "border:1px solid #ddd;border-radius:10px;" +
      "padding:12px;margin:10px 0;";

    const label = document.createElement("label");
    label.textContent = name;

    const input = document.createElement("input");
    input.placeholder = "例如：A";
    input.value = item.option_code || "";
    input.maxLength = 8;
    input.dataset.id = item.id;
    input.dataset.table = table;
    input.dataset.original = item.option_code || "";
    input.className = "ocCode";

    input.oninput = () => {
      input.value = input.value
        .normalize("NFKC").toUpperCase();
    };

    row.append(label, input);
    container.append(row);
  }

  async function load() {
    const current = ++revision;
    const activity = el("ocActivity").value;

    el("ocProducts").replaceChildren();
    el("ocPromotions").replaceChildren();
    el("ocSave").disabled = true;
    msg.textContent = "讀取中…";

    if (!activity) {
      msg.textContent = "請先建立團購活動";
      return;
    }

    try {
      const [products, promotions] =
        await Promise.all([
          db.from("activity_products")
            .select(
              "id,option_code,activity_price," +
              "products(product_name)"
            )
            .eq("activity_id", activity)
            .eq("is_available", true),

          db.from("promotions")
            .select(
              "id,promotion_name,option_code,is_active"
            )
            .eq("activity_id", activity)
        ]);

      if (current !== revision) return;
      if (products.error) throw products.error;
      if (promotions.error) throw promotions.error;

      for (const p of products.data || []) {
        addRow(
          el("ocProducts"),
          p,
          (p.products?.product_name || "商品") +
          "｜" + p.activity_price + "元",
          "activity_products"
        );
      }

      for (const p of promotions.data || []) {
        addRow(
          el("ocPromotions"),
          p,
          p.promotion_name +
          (p.is_active ? "" : "（已停用）"),
          "promotions"
        );
      }

      if (!products.data?.length) {
        el("ocProducts").textContent =
          "尚未設定活動商品";
      }

      if (!promotions.data?.length) {
        el("ocPromotions").textContent =
          "尚未設定活動優惠";
      }

      msg.textContent = "";
      el("ocSave").disabled = false;

    } catch (e) {
      msg.textContent = "讀取失敗：" + e.message;
    }
  }

  button.onclick = async () => {
    box.hidden = !box.hidden;
    if (box.hidden) return;

    el("ocSave").disabled = true;

    const { data, error } = await db
      .from("activities")
      .select("id,activity_name")
      .order("created_at", { ascending: false });

    if (error) {
      msg.textContent = error.message;
      return;
    }

    el("ocActivity").replaceChildren();

    for (const a of data || []) {
      el("ocActivity").add(
        new Option(a.activity_name, a.id)
      );
    }

    await load();
  };

  el("ocActivity").onchange = load;

  el("ocSave").onclick = async () => {
    const inputs = [
      ...box.querySelectorAll(".ocCode")
    ];

    const codes = new Set();

    for (const input of inputs) {
      const code = input.value
        .normalize("NFKC").trim().toUpperCase();

      input.value = code;

      if (!code) continue;

      if (!/^[A-Z0-9]{1,8}$/.test(code)) {
        msg.textContent =
          "代號只能使用英文字母或數字";
        return;
      }

      if (codes.has(code)) {
        msg.textContent =
          "代號 " + code + " 重複，請修改";
        return;
      }

      codes.add(code);
    }

    el("ocSave").disabled = true;
    el("ocActivity").disabled = true;
    inputs.forEach(i => i.disabled = true);

    let saved = 0;

    try {
      for (const input of inputs) {
        if (input.value === input.dataset.original) {
          continue;
        }

        const { error } = await db
          .from(input.dataset.table)
          .update({
            option_code: input.value || null
          })
          .eq("id", input.dataset.id)
          .eq("activity_id", el("ocActivity").value);

        if (error) throw error;

        input.dataset.original = input.value;
        saved++;
      }

      msg.textContent = "✅ 喊單代號儲存成功";

    } catch (e) {
      msg.textContent =
        "已更新 " + saved + " 筆，" +
        "其餘儲存失敗：" + e.message;
    } finally {
      el("ocSave").disabled = false;
      el("ocActivity").disabled = false;
      inputs.forEach(i => i.disabled = false);
    }
  };

  db.auth.onAuthStateChange((event, session) => {
    if (!session) {
      revision++;
      box.hidden = true;
      el("ocActivity").replaceChildren();
      el("ocProducts").replaceChildren();
      el("ocPromotions").replaceChildren();
      msg.textContent = "";
    }
  });
})();
</script>
